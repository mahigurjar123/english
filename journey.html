<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30-Din Learning Journey — सीखो</title>
<meta name="description" content="Day-by-day English learning journey for Hindi speakers — ek tense, kuch shabd, aur ek practice check, roz.">
<style>
/* ============================================================
   TOKENS — Language Dojo design system (matches english_learning_site.html)
   ============================================================ */
:root{
  --ink:#2a2416;
  --paper:#f7f2e7;
  --paper-raised:#fffdf8;
  --paper-sunk:#ede5d3;
  --accent:#c97a1a;
  --accent-soft:#f0d9ad;
  --sage:#2f7566;
  --sage-soft:#d3e7e1;
  --coral:#c8503b;
  --coral-soft:#f3d9d2;
  --line:#d9cbaa;
  --line-strong:#b8a67e;
  --muted:#6b6047;
  --muted-2:#8a7d5e;
  --shadow: 20 16% 20%;

  --font-dev: 'Nirmala UI','Noto Sans Devanagari','Noto Serif Devanagari','Mangal','Kohinoor Devanagari',sans-serif;
  --font-dev-serif: 'Noto Serif Devanagari','Nirmala UI','Mangal',serif;
  --font-display: 'Fraunces','Iowan Old Style','Palatino Linotype','Georgia',serif;
  --font-body: 'Sora','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono: 'Cascadia Mono','Consolas',monospace;

  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f4ecd8;
    --paper:#1a1f3a;
    --paper-raised:#232a4d;
    --paper-sunk:#141833;
    --accent:#e8952e;
    --accent-soft:#4a3a1e;
    --sage:#4bab98;
    --sage-soft:#1d3c37;
    --coral:#e0654f;
    --coral-soft:#432521;
    --line:#3a4270;
    --line-strong:#525c92;
    --muted:#a9a2c4;
    --muted-2:#8781a8;
    --shadow: 240 60% 3%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#f4ecd8;
  --paper:#1a1f3a;
  --paper-raised:#232a4d;
  --paper-sunk:#141833;
  --accent:#e8952e;
  --accent-soft:#4a3a1e;
  --sage:#4bab98;
  --sage-soft:#1d3c37;
  --coral:#e0654f;
  --coral-soft:#432521;
  --line:#3a4270;
  --line-strong:#525c92;
  --muted:#a9a2c4;
  --muted-2:#8781a8;
  --shadow: 240 60% 3%;
  color-scheme: dark;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  position:relative;
}

.hi{ font-family:var(--font-dev); }
h1,h2,h3,h4{ font-family:var(--font-display); text-wrap:balance; margin:0 0 .4em; font-weight:600; }
p{ margin:0 0 1em; }
a{ color:var(--accent); }
::selection{ background:var(--accent-soft); color:var(--ink); }

.container{ max-width:1100px; margin:0 auto; padding:0 1.5rem; }

button{ font-family:var(--font-body); cursor:pointer; }
:focus-visible{ outline:3px solid var(--sage); outline-offset:2px; border-radius:4px; }

/* ============================================================
   AMBIENT BACKGROUND — subtle drifting blobs + glyphs
   ============================================================ */
#ambient{
  position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
}
.blob{
  position:absolute; border-radius:50%; filter:blur(60px); opacity:.16;
  will-change:transform;
}
.blob-a{
  width:38vw; height:38vw; top:-10%; left:-8%;
  background:radial-gradient(circle, var(--accent), transparent 70%);
  animation:driftA 46s ease-in-out infinite;
}
.blob-b{
  width:32vw; height:32vw; bottom:-12%; right:-6%;
  background:radial-gradient(circle, var(--sage), transparent 70%);
  animation:driftB 54s ease-in-out infinite;
}
.blob-c{
  width:26vw; height:26vw; top:40%; left:60%;
  background:radial-gradient(circle, var(--coral), transparent 70%);
  animation:driftC 60s ease-in-out infinite;
}
@keyframes driftA{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(6vw,8vh) scale(1.12); }
}
@keyframes driftB{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(-7vw,-6vh) scale(1.08); }
}
@keyframes driftC{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(-5vw,7vh) scale(.94); }
}
.glyph{
  position:absolute; font-family:var(--font-dev-serif); color:var(--muted-2);
  opacity:.05; user-select:none; font-weight:700;
}
.glyph-1{ top:8%; left:12%; font-size:11rem; animation:spinSlow 120s linear infinite; }
.glyph-2{ bottom:6%; right:8%; font-size:9rem; animation:spinSlow 150s linear infinite reverse; }
.glyph-3{ top:55%; left:78%; font-size:7rem; font-family:var(--font-display); animation:spinSlow 100s linear infinite; }
@keyframes spinSlow{
  0%{ transform:rotate(0deg); }
  100%{ transform:rotate(360deg); }
}
@media (prefers-reduced-motion: reduce){
  .blob, .glyph{ animation:none !important; }
}
@media (max-width:700px){
  .glyph-1{ font-size:7rem; }
  .glyph-2{ font-size:6rem; }
  .glyph-3{ display:none; }
}

/* ============================================================
   NAV
   ============================================================ */
header.site-nav{
  position:sticky; top:0; z-index:190;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px) saturate(1.2);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  max-width:1200px; margin:0 auto; padding:.7rem 1.2rem;
  display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
}
.brand{
  font-family:var(--font-display); font-weight:700; font-size:1.25rem;
  display:flex; align-items:baseline; gap:.35rem; white-space:nowrap;
  color:var(--ink); text-decoration:none;
}
.brand .dev{ font-family:var(--font-dev-serif); color:var(--accent); }
.back-link{
  white-space:nowrap; text-decoration:none; color:var(--muted);
  font-size:.85rem; font-weight:600; letter-spacing:.02em;
  padding:.45rem .65rem; border-radius:6px; transition:color .15s, background .15s;
  border:1px solid var(--line);
}
.back-link:hover, .back-link:focus-visible{ color:var(--ink); background:var(--paper-sunk); }
.nav-spacer{ flex:1; }
.theme-toggle{
  border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink);
  border-radius:20px; padding:.4rem .8rem; font-size:.8rem; font-weight:600;
  flex-shrink:0;
}
.theme-toggle:hover{ border-color:var(--accent); }

/* ============================================================
   PAGE HEAD
   ============================================================ */
.page-head{ padding:2.2rem 0 1rem; text-align:center; }
.page-head .eyebrow{
  display:inline-block; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase;
  font-weight:700; color:var(--coral); margin-bottom:.5rem; font-family:var(--font-body);
}
.page-head h1{ font-size:clamp(1.9rem,4.4vw,2.9rem); margin-bottom:.3rem; }
.page-head .sub{ font-family:var(--font-dev); color:var(--muted); font-size:1.05rem; max-width:44rem; margin:0 auto; }

/* ============================================================
   JOURNEY MAP — horizontal day-node scroller
   ============================================================ */
.journey-map-wrap{
  position:sticky; top:53px; z-index:150;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:.85rem 0;
}
.journey-map{
  display:flex; gap:.55rem; overflow-x:auto; padding:.2rem 1.5rem .5rem;
  scrollbar-width:thin;
}
.journey-map::-webkit-scrollbar{ height:6px; }
.journey-map::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:4px; }
.day-node{
  flex-shrink:0; width:3rem; height:3rem; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:1.05rem;
  background:var(--paper-raised); border:2px solid var(--line); color:var(--muted);
  transition:transform .15s, border-color .15s, background .15s, color .15s;
  position:relative;
}
.day-node:hover:not(:disabled){ transform:translateY(-3px); border-color:var(--accent); color:var(--ink); }
.day-node.done{ border-color:var(--sage); color:var(--sage); background:var(--sage-soft); }
.day-node.active{
  background:var(--accent); border-color:var(--accent); color:var(--paper-raised);
  transform:scale(1.12);
  box-shadow:0 6px 18px -6px hsl(var(--shadow) / .5);
}
.day-node.soon{ opacity:.4; cursor:not-allowed; }
.day-node.soon::after{
  content:"soon"; position:absolute; bottom:-1.1rem; left:50%; transform:translateX(-50%);
  font-size:.55rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2);
  white-space:nowrap;
}
@media (max-width:700px){
  .journey-map-wrap{ top:49px; }
  .day-node{ width:2.5rem; height:2.5rem; font-size:.9rem; }
}

/* ============================================================
   DAY STAGE — the main content that swaps
   ============================================================ */
.day-stage{ padding:2.4rem 0 4rem; }
#dayContent{
  transition:opacity .35s ease, transform .35s ease;
}
#dayContent.transitioning{ opacity:0; transform:translateY(14px); }
@media (prefers-reduced-motion: reduce){
  #dayContent{ transition:none; }
  #dayContent.transitioning{ opacity:1; transform:none; }
}

.day-banner{
  display:flex; align-items:center; gap:1.1rem; flex-wrap:wrap;
  background:linear-gradient(120deg, var(--accent-soft), transparent);
  border:1px solid var(--line); border-radius:16px; padding:1.3rem 1.6rem; margin-bottom:2rem;
}
.day-banner .day-num{
  font-family:var(--font-display); font-weight:700; font-size:2.4rem; color:var(--accent);
  line-height:1;
}
.day-banner .day-info h2{ margin-bottom:.15rem; font-size:1.5rem; }
.day-banner .day-info .dev-name{ font-family:var(--font-dev); color:var(--muted); font-size:1rem; }
.day-banner .day-stats{
  margin-left:auto; display:flex; gap:1.4rem; flex-wrap:wrap;
}
.day-stat{ text-align:center; }
.day-stat .num{ font-family:var(--font-display); font-weight:700; font-size:1.3rem; color:var(--sage); display:block; }
.day-stat .lbl{ font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted-2); }

/* Section shells within a day */
.day-section{ margin-bottom:2.6rem; }
.day-section-head{ display:flex; align-items:baseline; gap:.7rem; margin-bottom:1rem; flex-wrap:wrap; }
.day-section-head h3{ font-size:1.3rem; margin:0; }
.day-section-head .hi-tag{ font-family:var(--font-dev); color:var(--muted); font-size:.95rem; }
.section-num{
  font-family:var(--font-display); font-size:.85rem; font-weight:700; color:var(--paper-raised);
  background:var(--accent); border-radius:50%; width:1.8rem; height:1.8rem;
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
}

.tense-rule{
  font-family:var(--font-dev); background:var(--sage-soft); color:var(--ink);
  border-left:4px solid var(--sage); padding:.9rem 1.1rem; border-radius:6px; margin:0 0 1.2rem;
}
.formula-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:.8rem;
}
.formula-card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:8px; padding:.9rem 1rem;
}
.formula-card .flabel{
  font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:var(--muted-2); margin-bottom:.4rem;
}
.formula-card code{
  display:block; font-family:var(--font-mono); font-size:.85rem; color:var(--accent); margin-bottom:.4rem; word-break:break-word;
}
.formula-card .fex{ font-size:.87rem; color:var(--muted); }
.formula-card.affirmative{ border-color:var(--sage); }
.formula-card.negative{ border-color:var(--coral); }
.formula-card.question{ border-color:var(--accent); }

/* ============================================================
   3D FLIP CARDS
   ============================================================ */
.flip-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:1rem;
}
.flip-card{
  perspective:1200px; height:9.5rem;
}
.flip-card-inner{
  position:relative; width:100%; height:100%;
  transition:transform .55s cubic-bezier(.2,.8,.3,1.1);
  transform-style:preserve-3d;
  cursor:pointer;
}
.flip-card.flipped .flip-card-inner{ transform:rotateY(180deg); }
.flip-face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:12px; border:1px solid var(--line); background:var(--paper-raised);
  padding:1rem 1.1rem; display:flex; flex-direction:column; justify-content:center;
  transition:border-color .18s, box-shadow .18s;
}
.flip-card:hover .flip-face{ border-color:var(--accent); box-shadow:0 10px 24px -12px hsl(var(--shadow) / .35); }
.flip-face.front .eng{ font-weight:700; font-size:1rem; margin-bottom:.5rem; }
.flip-face.front .hint{ font-size:.68rem; color:var(--muted-2); text-transform:uppercase; letter-spacing:.06em; }
.flip-face.back{ transform:rotateY(180deg); background:var(--sage-soft); border-color:var(--sage); }
.flip-face.back .pron{ font-family:var(--font-dev); color:var(--coral); font-size:.95rem; margin-bottom:.5rem; }
.flip-face.back .pron::before{ content:"उच्चारण · "; color:var(--muted-2); font-size:.7rem; }
.flip-face.back .meaning{ font-family:var(--font-dev); color:var(--sage); font-weight:600; font-size:1rem; }
.flip-face.back .meaning::before{ content:"अर्थ · "; color:var(--muted-2); font-size:.7rem; font-weight:400; }
@media (prefers-reduced-motion: reduce){
  .flip-card-inner{ transition:none; }
}

.word-flip .flip-card{ height:7.5rem; }
.word-flip .flip-face.front .eng{ font-size:1.15rem; }

.more-note{ font-size:.85rem; color:var(--muted-2); margin-top:1rem; font-style:italic; }
.more-note a{ color:var(--sage); }

/* ============================================================
   PRACTICE CHECK — quiz
   ============================================================ */
.quiz-card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:12px;
  padding:1.3rem 1.4rem; margin-bottom:1.1rem;
}
.quiz-q{ font-weight:700; margin-bottom:.85rem; font-size:1.02rem; }
.quiz-q .qn{ color:var(--accent); }
.quiz-opts{ display:flex; flex-direction:column; gap:.5rem; }
.quiz-opt{
  text-align:left; background:var(--paper); border:1px solid var(--line-strong); border-radius:8px;
  padding:.65rem .85rem; font-size:.92rem; color:var(--ink); font-family:var(--font-body);
  transition:border-color .15s, background .15s;
}
.quiz-opt:hover:not(:disabled){ border-color:var(--accent); }
.quiz-opt.correct{ background:var(--sage-soft); border-color:var(--sage); font-weight:700; }
.quiz-opt.incorrect{ background:var(--coral-soft); border-color:var(--coral); }
.quiz-opt:disabled{ cursor:default; }
.quiz-feedback{ margin-top:.65rem; font-weight:600; font-family:var(--font-dev); font-size:.92rem; }
.quiz-feedback.correct{ color:var(--sage); }
.quiz-feedback.incorrect{ color:var(--coral); }

/* Day nav footer buttons */
.day-footer-nav{
  display:flex; justify-content:space-between; align-items:center; margin-top:2.5rem;
  gap:1rem; flex-wrap:wrap;
}
.day-footer-nav button{
  border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink);
  border-radius:10px; padding:.7rem 1.2rem; font-weight:600; font-size:.92rem;
  display:flex; align-items:center; gap:.5rem;
}
.day-footer-nav button:hover:not(:disabled){ border-color:var(--accent); }
.day-footer-nav button:disabled{ opacity:.4; cursor:not-allowed; }

/* Coming soon state */
.coming-soon{
  text-align:center; padding:4rem 1.5rem; background:var(--paper-raised);
  border:1px dashed var(--line-strong); border-radius:16px;
}
.coming-soon .big{ font-family:var(--font-dev-serif); font-size:3rem; color:var(--accent); margin-bottom:.6rem; }
.coming-soon p{ color:var(--muted); max-width:32rem; margin:0 auto; }

footer.site-footer{
  padding:3rem 0 2.5rem; text-align:center; background:var(--ink); color:var(--paper);
}
footer.site-footer .hi{ font-size:1.1rem; margin-bottom:.4rem; }
footer.site-footer .en{ color:color-mix(in srgb, var(--paper) 65%, transparent); font-style:italic; font-size:.85rem; }
footer.site-footer a{ color:var(--accent); }

@media (max-width:640px){
  .day-banner .day-stats{ margin-left:0; width:100%; justify-content:space-between; }
  .day-footer-nav{ flex-direction:column; }
  .day-footer-nav button{ width:100%; justify-content:center; }
}
</style>
</head>

<div id="ambient" aria-hidden="true">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>

  <div class="glyph glyph-2 hi">ख</div>

</div>

<header class="site-nav">
  <div class="nav-inner">
    <a href="english_learning_site.html" class="brand"><span class="dev hi">सी</span>kho</a>

</header>

<div class="page-head container">
  <div class="eyebrow">30-Din Learning Journey</div>
  <h1>Day-by-Day English Journey</h1>
  <div class="sub hi">Har din ek tense, kuch shabd, aur ek practice check — sab kuch ek hi screen par.</div>

<footer class="site-footer">

  <div class="en">A little every day, for thirty days. <a href="english_learning_site.html">Back to the main dojo &rarr;</a></div>
</footer>

<script>
/* ============================================================
   THEME TOGGLE
   ============================================================ */
(function(){
  var root = document.documentElement;
  var btn = document.getElementById('themeToggle');
  var stored = null;
  try{ stored = localStorage.getItem('dojo-theme'); }catch(e){}
  if(stored === 'light' || stored === 'dark'){ root.setAttribute('data-theme', stored); }
  function currentIsDark(){
    var attr = root.getAttribute('data-theme');
    if(attr === 'dark') return true;
    if(attr === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function updateLabel(){
    btn.textContent = currentIsDark() ? '☀ Light' : '🌙 Dark';
  }
  btn.addEventListener('click', function(){
    var next = currentIsDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('dojo-theme', next); }catch(e){}
    updateLabel();
  });
  updateLabel();
})();

/* ============================================================
   DAYS DATA — indices 0-11 fully populated (Day 1-12).
   Indices 12-29 (Day 13-30) will be appended by a follow-up task.
   Each element: {day, focusEn, focusHi, devTag, rule, formulas:{aff,neg,q}, sentences:[{en,pron,hi}], vocabTitle, words:[{en,pron,hi}], quiz:[{q,options:[],correctIndex}]}
   ============================================================ */
var DAYS = [];
window.DAYS = DAYS; // exposed early so a follow-up script can push() more days safely

/* -------- helper (used while authoring) -------- */
function T(en,pron,hi){ return {en:en,pron:pron,hi:hi}; }

/* ---------------------------------------------------------------
   DAY 1 — Present Simple
   --------------------------------------------------------------- */
DAYS.push({
  day: 1,
  focusEn: "Present Simple",
  focusHi: "वर्तमान सामान्य काल",
  devTag: "Present · Simple",
  rule: "Roz ka kaam, habit, fact, ya sachai batane ke liye. Hindi identification: sentence 'ता है / ती है / ते हैं' par khatam hota hai.",
  formulas: {
    aff: {label:"Affirmative", f:"S + V1(s/es) + O", ex:"He plays cricket. / I play cricket."},
    neg: {label:"Negative", f:"S + do/does + not + V1 + O", ex:"He does not play cricket."},
    q:   {label:"Question", f:"Do/Does + S + V1 + O?", ex:"Does he play cricket?"}
  },
  sentences: [
    T("I wake up at six every morning.","आइ वेक अप एट सिक्स एवरी मॉर्निंग","मैं हर सुबह छह बजे उठता हूँ।"),
    T("You drink tea in the morning.","यू ड्रिंक टी इन द मॉर्निंग","तुम सुबह चाय पीते हो।"),
    T("He takes a bath every day.","ही टेक्स अ बाथ एवरी डे","वह हर दिन नहाता है।"),

/* ============================================================
   RENDER — journey map (nodes 1-30, always loops to 30)
   ============================================================ */
var TOTAL_DAYS = 30;
var currentDay = 1;

function renderJourneyMap(){
  var map = document.getElementById('journeyMap');
  map.innerHTML = '';
  for(var i=1;i<=TOTAL_DAYS;i++){
    var has = !!DAYS[i-1];
    var btn = document.createElement('button');
    btn.className = 'day-node' + (has ? ' done' : ' soon');
    btn.textContent = i;
    btn.setAttribute('role','tab');
    btn.setAttribute('data-day', i);
    btn.setAttribute('aria-selected', i === currentDay ? 'true' : 'false');
    if(!has){ btn.disabled = true; btn.setAttribute('aria-disabled','true'); btn.title = 'Coming soon'; }
    else{
      btn.title = 'Day ' + i + (DAYS[i-1] ? ' — ' + DAYS[i-1].focusEn : '');
      btn.addEventListener('click', function(){ goToDay(parseInt(this.getAttribute('data-day'),10)); });
    }
    map.appendChild(btn);
  }
  highlightActiveNode();
}

function highlightActiveNode(){
  var nodes = document.querySelectorAll('.day-node');
  nodes.forEach(function(n){
    var d = parseInt(n.getAttribute('data-day'),10);
    n.classList.toggle('active', d === currentDay);
    n.setAttribute('aria-selected', d === currentDay ? 'true' : 'false');
  });
}

   ============================================================ */
function buildFlipCard(front, backLine1, backLine2, cssClass){
  var wrap = document.createElement('div');
  wrap.className = 'flip-card';
  wrap.tabIndex = 0;
  wrap.setAttribute('role','button');
  wrap.setAttribute('aria-pressed','false');
  wrap.innerHTML =
    '<div class="flip-card-inner">' +
      '<div class="flip-face front"><div class="eng">' + escapeHtml(front) + '</div><div class="hint">Tap to flip</div></div>' +
      '<div class="flip-face back"><div class="pron">' + escapeHtml(backLine1) + '</div><div class="meaning">' + escapeHtml(backLine2) + '</div></div>' +
    '</div>';
  function toggle(){
    var flipped = wrap.classList.toggle('flipped');
    wrap.setAttribute('aria-pressed', flipped ? 'true' : 'false');
  }
  wrap.addEventListener('click', toggle);
  wrap.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
  });
  return wrap;
}

function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function renderQuiz(container, quizItems){
  quizItems.forEach(function(item, qi){
    var card = document.createElement('div');
    card.className = 'quiz-card';
    var qEl = document.createElement('div');
    qEl.className = 'quiz-q';
    qEl.innerHTML = '<span class="qn">Q' + (qi+1) + '.</span> ' + escapeHtml(item.q);
    card.appendChild(qEl);
    var opts = document.createElement('div');
    opts.className = 'quiz-opts';
    var feedback = document.createElement('div');
    feedback.className = 'quiz-feedback';
    item.options.forEach(function(optText, oi){
      var ob = document.createElement('button');
      ob.type = 'button';
      ob.className = 'quiz-opt';
      ob.textContent = optText;
      ob.addEventListener('click', function(){
        var allOpts = opts.querySelectorAll('.quiz-opt');
        allOpts.forEach(function(o){ o.disabled = true; });
        if(oi === item.correctIndex){
          ob.classList.add('correct');
          feedback.textContent = 'सही जवाब! Correct.';
          feedback.className = 'quiz-feedback correct';
        }else{
          ob.classList.add('incorrect');
          allOpts[item.correctIndex].classList.add('correct');
          feedback.textContent = 'गलत — सही जवाब हाइलाइट किया गया है।';
          feedback.className = 'quiz-feedback incorrect';
        }
      });
      opts.appendChild(ob);
    });
    card.appendChild(opts);
    card.appendChild(feedback);
    container.appendChild(card);
  });
}

  prevBtn.addEventListener('click', function(){ goToDay(dayNum - 1); });
  var nextBtn = document.createElement('button');
  nextBtn.innerHTML = 'Next Day &rarr;';
  nextBtn.disabled = dayNum >= TOTAL_DAYS;
  nextBtn.addEventListener('click', function(){ goToDay(dayNum + 1); });
  footNav.appendChild(prevBtn);
  footNav.appendChild(nextBtn);
  content.appendChild(footNav);
}

var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function goToDay(dayNum){
  if(dayNum < 1 || dayNum > TOTAL_DAYS) return;
  currentDay = dayNum;
  highlightActiveNode();
  var content = document.getElementById('dayContent');
  if(reduceMotion){
    renderDay(dayNum);
    window.scrollTo({top:0, behavior:'auto'});
    return;
  }
  content.classList.add('transitioning');
  window.setTimeout(function(){
    renderDay(dayNum);
    content.classList.remove('transitioning');
    var mapWrap = document.querySelector('.journey-map-wrap');
    var y = mapWrap.getBoundingClientRect().bottom + window.scrollY - 70;
    window.scrollTo({top: Math.max(0,y), behavior:'smooth'});
  }, 220);
}

/* ============================================================
   INIT
   ============================================================ */
function initJourney(){
  renderJourneyMap();
  renderDay(currentDay);
}
initJourney();
</script>
</body>
</html>
